# Noxa avec Docker : docker compose up -d, puis http://<serveur>:8420
# Le code d'installation du premier lancement s'affiche avec : docker compose logs noxa
services:
  noxa:
    # branche test : image de test, reconstruite à chaque mise à jour de la branche (sur main : noxa:latest)
    image: ghcr.io/xenix13/noxa:test
    container_name: noxa
    restart: unless-stopped
    ports:
      - "8420:8420"
      - "8421:8421"                  # serveurs liés (TLS) : utile seulement si un autre serveur Noxa doit joindre celui-ci
    environment:
      # derrière un reverse proxy HTTPS (nginx, Caddy…) : cookies sécurisés et vraie IP des clients
      SEANCE_COOKIE_SECURE: "0"
      SEANCE_TRUST_PROXY: "0"
    volumes:
      - ./data:/data                 # base, cache des images et sous-titres (doit appartenir à l'uid 1000)
      - /mnt/films:/media/films:ro   # tes médias, en lecture seule ; ajoute une ligne par dossier
      - /mnt/series:/media/series:ro
      # - /mnt/photos:/media/photos:ro  # photothèque (bibliothèque de type « Photos »)
      # - /mnt/livres-audio:/media/livres-audio:ro  # livres audio (bibliothèque de type « Livres audio »)
      # - /mnt/nas/noxa:/backups      # sauvegardes sur un autre disque (Paramètres → Sauvegardes : /backups)
    # Serveur DLNA (Paramètres → DLNA) : l'annonce aux téléviseurs ne traverse pas le réseau interne de Docker.
    # Décommente network_mode et retire la section ports (les ports de l'hôte sont alors utilisés directement).
    # network_mode: host
    # Transcodage matériel Intel / AMD (VAAPI) : décommente, et mets le GID du groupe « render » de l'hôte
    # (getent group render) dans group_add
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "993"
    # Transcodage matériel NVIDIA : pilote sur l'hôte + NVIDIA Container Toolkit, puis décommente
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video, compute, utility]
