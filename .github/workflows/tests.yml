name: Tests
on:
  push:
  pull_request:
jobs:
  api:
    # même système que l'image Docker (ubuntu:24.04, ffmpeg 6.1) : on teste ce qui est livré
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        timeout-minutes: 14
        # le miroir apt des machines GitHub se fige parfois : délais courts, et jusqu'à trois essais de 4 minutes
        run: |
          for i in 1 2 3; do
            timeout 240 sh -c 'sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq &&
              sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg' && exit 0
            echo "apt bloqué (essai $i), nouvel essai"
          done
          exit 1
      - run: pip install pillow
      - run: python -m unittest discover -s tests -t . -v
      - run: for f in deploy/*.sh; do bash -n "$f"; done
      - run: deploy/build-deb.sh dist && dpkg-deb --info dist/*.deb
      - run: for f in static/js/*.js static/js/views/*.js; do node --check --input-type=module < "$f"; done

  # Magasin de thèmes : chaque thème proposé (dossier static/themes) est vérifié — format, couleurs lisibles —
  # sans attendre les autres tests ; sur main, l'index lu par les serveurs Nexis est régénéré et enregistré.
  themes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les thèmes
        run: python3 -m seance.themes check-files static/themes
      - name: Index des thèmes (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 -m seance.themes build static/themes
          if ! git diff --quiet -- static/themes/index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add static/themes/index.json
            git commit -m "Index des thèmes"
            git push
          fi

  # Après les tests, sur main : image Docker (ghcr.io/<propriétaire>/nexis:latest) et, à chaque nouvelle
  # version, une publication GitHub avec le paquet .deb. Sur test : image ghcr.io/<propriétaire>/nexis:test
  # (celle du docker-compose.yml de la branche test), sans publication.
  release:
    needs: api
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: |
          echo "version=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("seance/__init__.py").read()).group(1))')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/nexis" >> "$GITHUB_OUTPUT"
      - name: Le docker-compose.yml de main installe la version publiée (pas celle de test)
        if: github.ref == 'refs/heads/main'
        run: |
          grep -q 'ghcr.io/xenix13/nexis:latest' docker-compose.yml || {
            echo "docker-compose.yml : l'image doit être ghcr.io/xenix13/nexis:latest sur main (fusion depuis test ?)"; exit 1; }
      - name: Paquet .deb et publication (nouvelle version seulement)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V déjà publiée"; exit 0; fi
          deploy/build-deb.sh dist
          gh release create "v$V" dist/nexis_${V}_all.deb --target "$GITHUB_SHA" --title "Nexis $V" --generate-notes
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ github.ref == 'refs/heads/main' && format('{0}:latest,{0}:{1}', steps.v.outputs.image, steps.v.outputs.version) || format('{0}:test', steps.v.outputs.image) }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # Appli Android TV : compilée sur test (vérification) et sur main, où elle est jointe à la publication.
  # Signature : secrets NEXIS_KEYSTORE (clé en base64) et NEXIS_KEYSTORE_PASSWORD (voir le README).
  android:
    needs: [api, release]
    if: >-
      !failure() && !cancelled() && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilation de l'APK
        env:
          KEYSTORE_B64: ${{ secrets.NEXIS_KEYSTORE }}
          NEXIS_KEYSTORE_PASSWORD: ${{ secrets.NEXIS_KEYSTORE_PASSWORD }}
        run: |
          V=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("seance/__init__.py").read()).group(1))')
          CODE=$(python3 -c "a,b,c=(int(x) for x in '$V'.split('.')[:3]); print(a*10000+b*100+c)")
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexis.p12"
            export NEXIS_KEYSTORE="$RUNNER_TEMP/nexis.p12"
          else
            echo "::warning::Secrets NEXIS_KEYSTORE absents : APK signé avec une clé de développement"
          fi
          set +e
          gradle -p android assembleRelease --no-daemon -PnexisVersionName="$V" -PnexisVersionCode="$CODE" > build.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            grep -E "error:|e: |What went wrong|FAILED|Could not|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit $status
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "nexis-tv-$V.apk"
          # application téléphone et tablette (module mobile) : publiée avec les applications de bureau
          mkdir -p apps-out
          cp android/mobile/build/outputs/apk/release/mobile-release.apk apps-out/nexis-android.apk
          cp "nexis-tv-$V.apk" apps-out/nexis-tv.apk
          # empreinte du certificat de signature : doit rester la même d'une version à l'autre
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$SIGNER" ]; then
            FP=$("$SIGNER" verify --print-certs "nexis-tv-$V.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            echo "::notice::Certificat de l'APK (SHA-256) : $FP"
          fi
          echo "V=$V" >> "$GITHUB_ENV"
      - name: APK de test (pré-version « tv-test »)
        if: github.ref == 'refs/heads/test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # à installer pour essayer la branche test avant son passage sur main ; ignorée par /tv et « latest »
          cp "nexis-tv-$V.apk" nexis-tv-test.apk
          if ! gh release view tv-test >/dev/null 2>&1; then
            gh release create tv-test --prerelease --target test --title "Application TV (test)" \
              --notes "APK construit depuis la branche test, pour essai. Ne pas utiliser au quotidien."
          fi
          gh release upload tv-test nexis-tv-test.apk --clobber
      - name: Ajout à la publication
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "nexis-tv-$V.apk" nexis-tv.apk  # nom fixe : …/releases/latest/download/nexis-tv.apk (adresse /tv du serveur)
          gh release view "v$V" >/dev/null 2>&1 && gh release upload "v$V" "nexis-tv-$V.apk" nexis-tv.apk --clobber || echo "Pas de publication v$V"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apps
          path: apps-out/*.apk

  # Application de bureau (Electron) : Windows (installateur), macOS (image disque universelle), Linux (AppImage,
  # .deb). Construites sur chaque système, puis jointes à la publication avec l'APK Android (job apps).
  desktop:
    needs: api
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Construction
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"  # pas de certificat : Windows et macOS demandent une confirmation au 1er lancement
        run: |
          npm ci --no-audit --no-fund
          npm run icon
          npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/Nexis-Setup.exe*
            apps/desktop/dist/Nexis.dmg
            apps/desktop/dist/Nexis.AppImage
            apps/desktop/dist/nexis-desktop.deb
            apps/desktop/dist/latest*.yml

  # Publication des applications : avec la version (main), ou dans la pré-version « apps-test » (test). Chaque serveur
  # Nexis lit cette publication pour sa page Applications et les mises à jour des applications (seance/apps.py).
  apps:
    needs: [desktop, android]
    if: >-
      !failure() && !cancelled() && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # seulement les applications (pas le relevé de construction Docker, qui ne se télécharge pas)
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: android-apps
          path: out
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("seance/__init__.py").read()).group(1))')
          # versions des applications (indépendantes de celle du serveur), lues par les applications pour se mettre à jour
          python3 - > out/nexis-apps.json <<'PY'
          import json, re
          g = open("android/mobile/build.gradle").read()
          print(json.dumps({
              "desktop": json.load(open("apps/desktop/package.json"))["version"],
              "android": {"version": re.search(r"versionName '([^']+)'", g).group(1), "code": int(re.search(r"versionCode (\d+)", g).group(1))},
          }))
          PY
          ls -la out
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG="v$V"
            gh release view "$TAG" >/dev/null 2>&1 || { echo "Pas de publication $TAG"; exit 0; }
          else
            TAG=apps-test
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target test \
              --title "Applications (test)" --notes "Applications construites depuis la branche test, pour essai."
          fi
          gh release upload "$TAG" out/* --clobber
