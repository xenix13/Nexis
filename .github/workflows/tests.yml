name: Tests
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq ffmpeg
      - run: python -m unittest discover -s tests -t . -v
      - run: bash -n deploy/install.sh
      - run: for f in static/js/*.js static/js/views/*.js; do node --check --input-type=module < "$f"; done
