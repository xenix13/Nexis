name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation and why it matters to you.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other solutions you considered.
