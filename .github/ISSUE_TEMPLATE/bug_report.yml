name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Security issues must **not** be reported here: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Nexis version
      description: Settings → Overview
      placeholder: "4.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Proxmox LXC script
        - Install script (Debian / Ubuntu)
        - .deb package
        - Docker
        - From source
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Device and app
      description: Browser, desktop app, Android, Android TV, iPhone…
      placeholder: "Chrome 131 on Windows 11"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines of `journalctl -u seance` (Docker `docker logs nexis`). Remove addresses, names and tokens. For playback problems, add the title's "File information".
      render: text
