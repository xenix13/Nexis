<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexis</title>
<style>
  :root { color-scheme: dark; --accent: #ffa43a; --bg: #0b0b0e; --surface: #16161b; --line: rgba(255,255,255,.1); --text: #f5f3ef; --muted: #a6a3ae; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; place-items: center; padding: 24px; }
  main { width: 100%; max-width: 440px; }
  img { width: 72px; height: 72px; display: block; margin-bottom: 18px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.01em; }
  p { color: var(--muted); margin: 0 0 18px; }
  form { display: flex; flex-direction: column; gap: 10px; }
  input { height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: inherit; font: inherit; outline: none; }
  input:focus { border-color: var(--accent); }
  button { height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: #1c0f00; font: 700 16px system-ui, sans-serif; cursor: pointer; }
  button.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .6; }
  .error { color: #ff6b6b; min-height: 1.4em; font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="build/icon.png" alt="">
  <h1 id="title"></h1>
  <p id="lead"></p>
  <form id="form">
    <input id="url" type="text" autocomplete="url" spellcheck="false" autofocus>
    <div class="error" id="error"></div>
    <button id="go" type="submit"></button>
    <button id="retry" class="ghost" type="button" hidden></button>
  </form>
</main>
<script>
  const n = window.nexisNative;
  const T = n.strings;
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  document.documentElement.lang = T.connect === 'Connect' ? 'en' : 'fr';
  const offline = q.get('offline');
  $('title').textContent = offline ? T.offlineTitle : T.setupTitle;
  $('lead').textContent = offline ? T.offlineLead.replace('{server}', offline) : T.setupLead;
  $('url').placeholder = T.setupPlaceholder;
  $('url').value = offline || q.get('current') || '';
  $('go').textContent = offline ? T.connect : T.connect;
  if (offline) {
    $('error').textContent = q.get('error') || '';
    $('retry').hidden = false;
    $('retry').textContent = T.retry;
    $('retry').onclick = () => n.retry();
  }
  $('form').onsubmit = async (e) => {
    e.preventDefault();
    $('go').disabled = true;
    $('go').textContent = T.checking;
    $('error').textContent = '';
    const r = await n.setServer($('url').value);
    if (!r.ok) {
      $('error').textContent = r.error;
      $('go').disabled = false;
      $('go').textContent = T.connect;
    }
  };
</script>
</body>
</html>
